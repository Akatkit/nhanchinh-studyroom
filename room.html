<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phòng học - Nhân Chính Study Room</title>
  </head>
  <body>
    <main style="padding:12px">
      <h2 id="room-name" style="text-align:center;margin:8px 0"></h2>
      <div id="game"></div>

      <div class="timer-bar">
        <div id="status">Chạm vào một chiếc ghế để ngồi</div>
        <div id="timer">25:00</div>
        <div class="row">
          <button id="pause" class="btn-secondary">Tạm dừng</button>
          <button id="stand" class="btn-secondary">Đứng dậy</button>
        </div>
        <a class="btn-secondary" href="/rooms.html" style="margin-top:10px">Chọn phòng khác</a>
      </div>
    </main>
    <script type="module" src="/src/room.js"></script>
  </body>
</html>
